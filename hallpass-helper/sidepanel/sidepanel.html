<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HallPass Helper</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="row">
      <h1>HallPass Helper</h1>
      <button id="settings" class="link" type="button">Settings</button>
    </header>

    <section id="hallpass" class="status">
      <span class="dot"></span>
      <span class="text"></span>
      <button id="openHallpass" class="link" type="button"></button>
    </section>

    <section id="teach" class="card teach" aria-live="polite"></section>

    <section>
      <div class="row section-head">
        <h2>Queue <span id="queueCount"></span></h2>
        <button id="pause" type="button"></button>
      </div>
      <p id="queueStatus" class="queue-status" aria-live="polite"></p>
      <form id="addForm" autocomplete="off">
        <input id="addName" type="text" placeholder="Type a student's name, then Enter" aria-label="Add a student to the queue" />
      </form>
      <div id="destinations" class="pills" role="radiogroup" aria-label="Destination"></div>
      <div id="suggestions" class="chips"></div>
      <ol id="queueList" class="queue-list"></ol>
    </section>

    <section>
      <h2>Out now <span id="outCount"></span></h2>
      <div id="outList" class="out-list"></div>
      <p id="outEmpty" class="hint">Students the helper sends show up here with a timer.</p>
    </section>

    <section class="tools">
      <button id="outlineButton" class="link" type="button">Copy HallPass page outline for Claude</button>
      <div id="outlineBox" hidden>
        <p class="hint">
          Student and staff names show up as "Xxxxx". Look it over before you send it, then paste it into an email or doc
          to yourself.
        </p>
        <textarea id="outlineText" rows="12" readonly aria-label="Page outline"></textarea>
        <div class="row">
          <button id="copyOutline" class="primary" type="button">Copy</button>
          <button id="closeOutline" type="button">Close</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="../content/core.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
