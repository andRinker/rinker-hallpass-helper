<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HallPass Helper</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="row">
        <select id="schedule" aria-label="Today's bell schedule"></select>
        <button id="settings" class="link" type="button">Settings</button>
      </div>
      <div id="clock" class="clock"></div>
    </header>

    <section id="hallpass" class="status">
      <span class="dot"></span>
      <span class="text"></span>
      <button id="openHallpass" class="link" type="button"></button>
    </section>

    <section id="teach" class="card teach" aria-live="polite"></section>

    <section>
      <h2 id="studentsTitle">My students</h2>
      <div id="destinations" class="pills" role="radiogroup" aria-label="Destination"></div>
      <input id="search" type="search" placeholder="Find any of your students" />
      <div id="students" class="chips"></div>
      <p id="studentsEmpty" class="hint" hidden></p>
    </section>

    <section>
      <h2>Who's out <span id="outCount"></span></h2>
      <div id="outList" class="out-list"></div>
      <p id="outEmpty" class="hint">Passes you make with the helper show up here.</p>
    </section>

    <section class="tools">
      <button id="outlineButton" class="link" type="button">Copy HallPass page outline for Claude</button>
      <div id="outlineBox" hidden>
        <p class="hint">
          Student and staff names show up as "Xxxxx". Look it over before you send it, then paste it into an email or doc
          to yourself.
        </p>
        <textarea id="outlineText" rows="12" readonly aria-label="Page outline"></textarea>
        <div class="row">
          <button id="copyOutline" class="primary" type="button">Copy</button>
          <button id="closeOutline" type="button">Close</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="../content/core.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
