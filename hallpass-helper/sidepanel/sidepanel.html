<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HallPass Helper</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="row">
      <h1>HallPass Helper <span id="version" class="version"></span></h1>
      <button id="settings" class="link" type="button">Settings</button>
    </header>

    <section id="hallpass" class="status">
      <span class="dot"></span>
      <span class="text"></span>
      <button id="openHallpass" class="link" type="button"></button>
    </section>

    <section id="lane" class="lane" aria-label="Which way passes are made and ended"></section>

    <section id="guide" class="guide"></section>

    <section id="teach" class="card teach" aria-live="polite"></section>

    <section>
      <div class="row section-head">
        <h2>Queue <span id="queueCount"></span></h2>
        <button id="pause" type="button"></button>
      </div>
      <p id="queueStatus" class="queue-status" aria-live="polite"></p>
      <details id="lastRun" class="hint" hidden>
        <summary id="lastRunSummary"></summary>
        <ul id="lastRunNotes"></ul>
      </details>
      <form id="addForm" autocomplete="off">
        <input id="addName" type="text" placeholder="Type a student's name, then Enter" aria-label="Add a student to the queue" />
      </form>
      <div id="destinations" class="pills" role="radiogroup" aria-label="Destination"></div>
      <div id="suggestions" class="chips"></div>
      <ol id="queueList" class="queue-list"></ol>
    </section>

    <section>
      <h2>Out now <span id="outCount"></span></h2>
      <div id="outList" class="out-list"></div>
      <p id="outEmpty" class="hint">Students the helper sends show up here with a timer.</p>
    </section>

    <section class="tools">
      <div class="tools-list">
        <button id="diagnoseButton" class="link" type="button">Run read-only self-check (dry run)</button>
        <button id="snapshotButton" class="link" type="button">Capture scrubbed DOM snapshot</button>
        <button id="outlineButton" class="link" type="button">Copy outline of open GoGuardian pages</button>
      </div>

      <div id="diagnoseBox" class="tool-box" hidden>
        <p id="diagnoseBadge" class="audit-banner"></p>
        <textarea id="diagnoseText" rows="12" readonly aria-label="Read-only self-check report"></textarea>
        <div class="row tool-actions">
          <button id="copyDiagnose" class="primary" type="button">Copy report</button>
          <button id="closeDiagnose" type="button">Close</button>
        </div>
      </div>

      <div id="snapshotBox" class="tool-box" hidden>
        <select id="snapshotPicker" aria-label="Choose captured page" hidden></select>
        <p id="snapshotStatus" class="audit-banner"></p>
        <p id="snapshotStats" class="hint"></p>
        <details id="snapshotWordsDetails" class="word-audit-details">
          <summary id="snapshotWordsSummary"></summary>
          <div id="snapshotWords" class="word-audit"></div>
        </details>
        <details class="word-audit-details">
          <summary>View raw scrubbed HTML</summary>
          <textarea id="snapshotHtml" rows="8" readonly aria-label="Scrubbed DOM snapshot HTML"></textarea>
        </details>
        <div class="row tool-actions">
          <button id="previewSnapshot" type="button">Preview in tab</button>
          <button id="downloadSnapshot" class="primary" type="button">Download .html</button>
          <button id="copySnapshot" type="button">Copy HTML</button>
          <button id="closeSnapshot" type="button">Close</button>
        </div>
      </div>

      <div id="outlineBox" class="tool-box" hidden>
        <p id="outlineHint" class="hint">
          Student and staff names show up as "Xxxxx". Look it over before you send it, then paste it into an email or doc
          to yourself.
        </p>
        <textarea id="outlineText" rows="12" readonly aria-label="Page outline"></textarea>
        <div class="row tool-actions">
          <button id="copyOutline" class="primary" type="button">Copy</button>
          <button id="closeOutline" type="button">Close</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="../content/core.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
