<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock HallPass (built-in shapes)</title>
    <!--
      A second stand-in for HallPass, shaped like the pages the built-in steps (lib/builtin.js) were taught on:
      a New Pass button, a Request Pass dialog whose student and destination are search boxes (a combobox button
      opens a box you type into, then you pick an option), a Submit button, and a Pass Details panel with End Pass
      and Close. Names are made up.
    -->
    <style>
      .b { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; border: 1px solid #888; padding: 4px 10px; margin: 2px; }
      [role="dialog"] { border: 1px solid #333; padding: 12px; margin: 10px 0; }
      [role="option"] { cursor: default; padding: 4px; }
      input { display: flex; width: 200px; }
    </style>
  </head>
  <body>
    <button class="b inline-flex items-center justify-center whitespace-nowrap" id="newPass" type="button">New Pass</button>
    <h2>Active Passes</h2>
    <ul id="list"></ul>
    <div id="host"></div>
    <script>
      const SCHOOL = ["Jordan Miller", "Ava Lee", "Sam Cho", "Priya Shah"];
      const DESTS = ["Bathroom", "Nurse", "Library"];
      const state = (window.__mock = { passes: [], seq: 1, log: [] });
      const $ = (s, r = document) => r.querySelector(s);
      const BTN = "b inline-flex items-center justify-center whitespace-nowrap";

      function renderList() {
        $("#list").innerHTML = "";
        for (const pass of state.passes) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = BTN;
          btn.textContent = `${pass.student} ${pass.dest}`.replace(/ (Bathroom|Nurse|Library)$/, "");
          btn.addEventListener("click", () => openDetails(pass));
          li.append(btn);
          $("#list").append(li);
        }
      }

      function openDetails(pass) {
        $("#host").innerHTML = `<div role="dialog" aria-label="Pass Details"><p class="who"></p><button type="button" class="${BTN} end">End Pass</button> <button type="button" class="${BTN} close">Close</button></div>`;
        $(".who").textContent = `${pass.student} · ${pass.dest}`;
        $(".end").addEventListener("click", () => {
          state.passes = state.passes.filter((p) => p !== pass);
          state.log.push(`ended ${pass.student}`);
          renderList();
          $(".end").remove();
        });
        $(".close").addEventListener("click", () => ($("#host").innerHTML = ""));
      }

      // A search-box dropdown: a combobox button opens a popover with a box to type in, then options to pick.
      function dropdown(root, placeholder, items, onPick) {
        const wrap = document.createElement("div");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("role", "combobox");
        btn.setAttribute("aria-haspopup", "listbox");
        btn.className = "b inline-flex items-center whitespace-nowrap rounded-md";
        btn.textContent = placeholder;
        wrap.append(btn);
        btn.addEventListener("click", () => {
          if ($(".pop", wrap)) return;
          const pop = document.createElement("div");
          pop.className = "pop";
          pop.innerHTML = `<input class="flex w-full rounded-md bg-transparent" type="text" role="combobox" aria-label="${placeholder}" /><div class="opts"></div>`;
          wrap.append(pop);
          const input = $("input", pop);
          input.addEventListener("input", () => {
            const q = input.value.trim().toLowerCase();
            const opts = $(".opts", pop);
            opts.innerHTML = "";
            for (const item of q ? items.filter((i) => i.toLowerCase().includes(q)) : []) {
              const o = document.createElement("div");
              o.setAttribute("role", "option");
              o.className = "relative flex cursor-default select-none";
              o.textContent = item;
              o.addEventListener("click", () => {
                btn.textContent = item;
                pop.remove();
                onPick(item);
              });
              opts.append(o);
            }
          });
          input.focus();
        });
        root.append(wrap);
      }

      function openForm() {
        $("#host").innerHTML = `<div role="dialog" aria-label="Request Pass"><h3>Request Pass</h3><div class="stu"></div><div class="dst"></div><button type="submit" class="${BTN} submit">Submit</button></div>`;
        const form = { student: null, dest: null };
        dropdown($(".stu"), "Select student", SCHOOL, (v) => (form.student = v));
        dropdown($(".dst"), "Select destination room", DESTS, (v) => (form.dest = v));
        $(".submit").addEventListener("click", () => {
          if (!form.student || !form.dest) return;
          state.passes.push({ student: form.student, dest: form.dest });
          state.log.push(`made ${form.student}`);
          renderList();
          $("#host").innerHTML = `<div role="dialog" aria-label="Pass Details"><p>Pass created</p><button type="button" class="${BTN} close">Close</button></div>`;
          $(".close").addEventListener("click", () => ($("#host").innerHTML = ""));
        });
      }

      $("#newPass").addEventListener("click", openForm);
    </script>
  </body>
</html>
